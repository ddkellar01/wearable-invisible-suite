name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .  # Installs the current package in editable mode so 'src' is discoverable
          
      - name: Run Code Linting & Unit Tests
        env:
          PYTHONPATH: .  # Ensures Python recognizes the root directory
        run: |
          pip install flake8 pytest
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest tests/
