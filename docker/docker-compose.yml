version: '3.8'

services:
  camouflage-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: invisible_suit_core
    runtime: nvidia
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/spidev0.0:/dev/spidev0.0"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../src:/workspace/src
      - ../config:/workspace/config
    restart: unless-stopped
