[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-invisible-suit"
version = "1.0.0"
description = "Wearable Invisible Body Motion Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pyserial>=3.5"
]

[tool.setuptools.packages.find]
include = ["src*", "tests*"]
